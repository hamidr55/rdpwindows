name: CI Runner2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'→ Runs at 0 minutes past the hour, every 5 hours

jobs:
  build-and-run:
    runs-on: windows-latest
    steps:
      - name: Environment Setup
        run: |
          Set-ExecutionPolicy Unrestricted -Scope Process -Force
          Write-Output "Initializing environment..."

      - name: Configure RDP User
        run: |
          $User = "rwa"
          $PasswordText = "Q350607p@"
          
          # ساخت یا آپدیت یوزر با پسورد صحیح
          $ExistingUser = Get-LocalUser -Name $User -ErrorAction SilentlyContinue
          if ($null -eq $ExistingUser) {
              $SecurePassword = ConvertTo-SecureString $PasswordText -AsPlainText -Force
              New-LocalUser $User -Password $SecurePassword -FullName "RDP User" -Description "RDP Admin User"
          } else {
              Set-LocalUser -Name $User -Password (ConvertTo-SecureString $PasswordText -AsPlainText -Force)
          }

          # عضویت در گروه‌های دسترسی ریموت و ادمین
          Add-LocalGroupMember -Group "Administrators" -Member $User -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $User -ErrorAction SilentlyContinue

          # غیرفعال کردن Network Level Authentication (NLA) برای پذیرش بی‌دردسر پسورد
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Output "RDP User configured successfully with correct password!"

      - name: Connect Mesh Network
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ("$env:TS_KEY" -ne "") {
            echo "Installing tailscale..."
            choco install tailscale -y

            # Enable IP Routing in Registry
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'IPEnableRouter' -Value 1

            # Enable & Start RemoteAccess / Routing Service
            Set-Service -Name RemoteAccess -StartupType Automatic
            Start-Service -Name RemoteAccess -ErrorAction SilentlyContinue

            # Connect Tailscale with explicit hostname and exit-node flag
            & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TS_KEY" --hostname="github-runner" --advertise-exit-node --unattended
            Start-Sleep -Seconds 10
          } else {
            echo "Tailscale key missing, skipping..."
          }

      - name: Keep Alive Loop
        run: |
          $timeout = 290
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            Write-Output "Session active... ($elapsed mins)"
            Start-Sleep -Seconds 60
            $elapsed++
          }

